[project]
name = "asus-keyboard-wakeup-fix"
version = "0.3.0"
description = "Model-specific ACPI table fixes and GPE14 wake workaround for ASUS FX608JPR"
readme = "README.md"
authors = [
    { name = "V9EQ", email = "54616877+V9EQ@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
asus-acpi = "asus_acpi.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asus_acpi"

[tool.ruff]
line-length = 99
target-version = "py313"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
